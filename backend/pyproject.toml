[project]
name = "hospital-ai-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30",
  "alembic>=1.14", "pydantic>=2.10", "pydantic-settings>=2.6", "argon2-cffi>=23.1",
  "pyjwt>=2.10", "cryptography>=43", "python-multipart>=0.0.17", "slowapi>=0.1.9",
  "google-genai>=3.0,<4", "apscheduler>=3.10,<4", "boto3>=1.35", "email-validator>=2.2",
  "python-json-logger>=2.0.7", "httpx>=0.27", "sentry-sdk>=2.0", "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.7", "black>=24", "mypy>=1.13",
       "bandit>=1.8", "pip-audit>=2.7", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008"]
[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
[tool.black]
line-length = 100
target-version = ["py313"]
[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
