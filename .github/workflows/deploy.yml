name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Image tag to deploy (default: current sha)", required: false }
permissions: { contents: read, packages: write }
concurrency: { group: deploy, cancel-in-progress: false }

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.tag.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then T="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then T="${GITHUB_REF_NAME}"
          else T="sha-${GITHUB_SHA::12}"; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/hospital-ai-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=   # same-origin: the reverse proxy routes /api to the backend
          tags: ghcr.io/${{ env.OWNER }}/hospital-ai-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Deploy over SSH (migrations, restart, smoke test, automatic rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/hospital
            git fetch --tags origin && git checkout --force "${{ github.sha }}"
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            ./infra/scripts/deploy.sh "${{ needs.publish.outputs.tag }}"
